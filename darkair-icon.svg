<?xml version="1.0" encoding="UTF-8"?>
<!-- DarkAir launcher icon: white-hot thermal scope view - black cold sky,
     washed-gray ridgeline, mottled ground, one hot blob with a red accent
     under a thin reticle (the HIKMICRO look from assets/reference). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4e"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>
    <clipPath id="scope"><circle cx="128" cy="128" r="104"/></clipPath>
  </defs>

  <!-- device body -->
  <rect x="8" y="8" width="240" height="240" rx="40" fill="#0b0b0e"/>
  <circle cx="128" cy="128" r="104" fill="#000000"/>

  <g clip-path="url(#scope)">
    <!-- far ridgeline: washed light gray, atmospherics-flattened -->
    <path d="M24 130 L60 100 L88 118 L122 92 L156 116 L192 98 L232 126 L232 132 L24 132 Z"
          fill="#6e6e73" opacity="0.55"/>
    <!-- near ridge band, slightly darker -->
    <path d="M24 138 L72 118 L120 134 L176 114 L232 136 L232 142 L24 142 Z"
          fill="#58585c" opacity="0.7"/>
    <!-- ground -->
    <rect x="24" y="140" width="208" height="92" fill="url(#ground)"/>
    <!-- vegetation mottle -->
    <ellipse cx="70" cy="170" rx="22" ry="7" fill="#141416" opacity="0.8"/>
    <ellipse cx="180" cy="188" rx="30" ry="9" fill="#141416" opacity="0.7"/>
    <ellipse cx="120" cy="205" rx="26" ry="8" fill="#101012" opacity="0.8"/>
    <ellipse cx="205" cy="160" rx="16" ry="5" fill="#5a5a5e" opacity="0.5"/>
    <ellipse cx="45" cy="195" rx="18" ry="6" fill="#565659" opacity="0.4"/>
    <!-- fence posts: dark silhouettes, lost with distance -->
    <rect x="58" y="128" width="3.5" height="26" fill="#0e0e10"/>
    <rect x="96" y="130" width="3" height="22" fill="#141416"/>
    <rect x="168" y="131" width="2.5" height="19" fill="#1a1a1c"/>
    <!-- the hot blob: bloom halo, white core, red hottest-spot accent -->
    <circle cx="128" cy="164" r="26" fill="url(#glow)"/>
    <ellipse cx="128" cy="166" rx="13" ry="10" fill="#ffffff"/>
    <ellipse cx="123" cy="158" rx="5" ry="7" fill="#ffffff"/>
    <circle cx="130" cy="165" r="3" fill="#ff3b1f"/>
    <!-- faint thermal reflection on damp ground -->
    <ellipse cx="128" cy="184" rx="11" ry="4" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- thin-line reticle, gap at center -->
  <g stroke="#d8d8dc" stroke-width="2" opacity="0.9">
    <line x1="128" y1="34" x2="128" y2="112"/>
    <line x1="128" y1="144" x2="128" y2="222"/>
    <line x1="34" y1="128" x2="112" y2="128"/>
    <line x1="144" y1="128" x2="222" y2="128"/>
  </g>

  <!-- scope rim -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#2e2e33" stroke-width="7"/>
  <circle cx="128" cy="128" r="99" fill="none" stroke="#000000" stroke-width="3"/>
</svg>

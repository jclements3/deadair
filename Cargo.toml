[package]
name = "deadair"
version = "0.1.0"
edition = "2021"
description = "Silent night-hunting business sim: thermal-honest optics, cold zombies, real P&L, scene editor"

[[bin]]
name = "deadair"
path = "src/main.rs"

[lib]
name = "deadair"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
